name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Verify formatting
        run: ruff format --check .
      - name: Generate deterministic demo data
        run: python scripts_generate_demo.py
      - name: Cache UCI SECOM dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: uci-secom-eea568baf3c2
      - name: Download verified UCI SECOM dataset
        run: python scripts_download_secom.py
      - name: Test with branch coverage
        run: pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
